<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#263d65"><text x="190" y="53" font-size="10" letter-spacing="2">PRIMARY / A</text><text x="555" y="54" font-size="10" letter-spacing="2">SECONDARY / B</text><text x="383" y="204" font-size="10" fill="#9c582a">mutual Hou interaction</text><text x="30" y="242" font-size="9" letter-spacing="1.5" fill="#6c7384">SHAPE + MASS → DYNAMICS → OBSERVATIONS → COVARIANCE</text><text x="718" y="242" font-size="9" fill="#6c7384">SCHEMATIC</text></g>
