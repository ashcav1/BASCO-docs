<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="title desc">
<title id="title">BASCO's coupled binary model</title><desc id="desc">Two extended bodies linked by mutual gravity. Shape and mass inform dynamics; observations and derivatives inform covariance.</desc>
