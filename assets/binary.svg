<path d="M246 150L576 118" stroke="#c8773e" stroke-width="1.5" stroke-dasharray="5 5"/>
<g transform="translate(261 145) rotate(-13)"><ellipse rx="81" ry="62" fill="url(#bodyA)"/><ellipse rx="81" ry="62" fill="none" stroke="#655495"/><ellipse rx="36" ry="62" fill="none" stroke="#ded7ed" stroke-opacity=".45"/><path d="M-78-10Q0 22 79-9M-69-32Q0-6 68-32M-71 31Q0 55 72 31" fill="none" stroke="#ded7ed" stroke-opacity=".4"/></g>
